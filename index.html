const CHAPTER_COLORS_KK = {
  "Базалық AI":"#2563EB","Агенттер":"#7C3AED","Дамыту":"#0891B2",
  "Суреттер":"#DC2626","Видео/Аудио":"#059669","Маркетинг":"#D97706","Тренд":"#DB2777",
};
const CHAPTER_COLORS_RU = {
  "Основы AI":"#2563EB","Агенты":"#7C3AED","Разработка":"#0891B2",
  "Изображения":"#DC2626","Видео/Аудио":"#059669","Маркетинг":"#D97706","Тренды":"#DB2777",
};

const CHIPS = ["LLM","Prompt","RAG","AI Agent","Hallucination","Fine-Tuning","Vibe Coding","Midjourney","AGI","LoRA","Supabase","ElevenLabs"];

const UI = {
  kk: {
    title:"AI Глоссарий Ассистент", sub:"термин · 7 тарау · қазақша/орысша",
    active:"Белсенді", all:"✕ Бәрі", allTerms:"барлық терминдер",
    welcome:"Сәлем! Мен AI Глоссарий Ассистентімін.",
    welcomeSub:"Кез-келген AI терминін сұраңыз. Жоғарыдағы тараулардан шолыңыз немесе төмендегі тақырыпшалардан таңдаңыз.",
    notFound:(q)=>`«${q}» бойынша ештеңе табылмады. Басқаша жазып көріңіз.`,
    placeholder:"Термин жазыңыз... (мысалы: RAG, token, агент)",
    btn:"Іздеу →", footer:"UPGRADE AI Академиясы",
    chapterColors: CHAPTER_COLORS_KK, catIndex: 3, termIndex: 1, descIndex: 2,
  },
  ru: {
    title:"AI Глоссарий Ассистент", sub:"терминов · 7 глав · казахский/русский",
    active:"Активен", all:"✕ Все", allTerms:"все термины",
    welcome:"Привет! Я AI Глоссарий Ассистент.",
    welcomeSub:"Спрашивайте любой AI-термин. Листайте по главам выше или выбирайте из быстрых тем ниже.",
    notFound:(q)=>`По запросу «${q}» ничего не найдено. Попробуйте иначе.`,
    placeholder:"Введите термин... (например: RAG, токен, агент)",
    btn:"Поиск →", footer:"UPGRADE AI Академиясы",
    chapterColors: CHAPTER_COLORS_RU, catIndex: 6, termIndex: 4, descIndex: 5,
  }
};

function normalize(s){ return s.toLowerCase().replace(/[^a-zа-яёіңүұқөәғһ0-9\s]/gi,"").trim(); }
function search(q, lang){
  const cfg = UI[lang];
  const nq=normalize(q), words=nq.split(/\s+/).filter(w=>w.length>1);
  if(!words.length) return [];
  let results=[];
  for(const t of GLOSSARY){
    const hay=normalize(t[0]+" "+t[cfg.termIndex]+" "+t[cfg.catIndex]);
    let score=0;
    for(const w of words){ if(hay.includes(w)) score+=hay.startsWith(w)?3:1; }
    if(score>0) results.push({t,score});
  }
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,4).map(r=>r.t);
}

function App(){
  const [lang, setLang] = useState("kk");
  const [messages,setMessages]=useState([{role:"bot",welcome:true}]);
  const [input,setInput]=useState("");
  const [activeChapter,setActiveChapter]=useState(null);
  const chatRef=useRef(null);

  useEffect(()=>{ if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; },[messages]);

  const cfg = UI[lang];
  const CHAPTERS = Object.keys(cfg.chapterColors);
  const color=(cat)=>cfg.chapterColors[cat]||"#6B7280";

  function switchLang(l){
    setLang(l);
    setActiveChapter(null);
    setMessages([{role:"bot",welcome:true}]);
  }

  function send(q){
    const query=(q||input).trim(); if(!query) return;
    setInput("");
    const results=search(query, lang);
    setMessages(prev=>[...prev,{role:"user",text:query},results.length?{role:"bot",results}:{role:"bot",notFound:query}]);
  }

  return (
    <div style={{fontFamily:"system-ui,sans-serif",maxWidth:680,margin:"0 auto",background:"#fff",borderRadius:16,padding:"20px 16px",boxShadow:"0 4px 24px #0001"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
        <div style={{width:44,height:44,borderRadius:"50%",background:"#EEF2FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🤖</div>
        <div>
          <div style={{fontWeight:600,fontSize:16,color:"#111827"}}>{cfg.title}</div>
          <div style={{fontSize:12,color:"#6B7280"}}>{GLOSSARY.length} {cfg.sub}</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          <div style={{background:"#DCFCE7",color:"#166534",fontSize:11,fontWeight:500,padding:"3px 10px",borderRadius:20}}>{cfg.active}</div>
          {/* Lang toggle */}
          <div style={{display:"flex",gap:4}}>
            {["kk","ru"].map(l=>(
              <button key={l} onClick={()=>switchLang(l)} style={{
                padding:"2px 10px",borderRadius:12,fontSize:11,cursor:"pointer",fontWeight:600,
                border:`1.5px solid ${lang===l?"#2563EB":"#E5E7EB"}`,
                background:lang===l?"#2563EB":"#fff",
                color:lang===l?"#fff":"#6B7280"
              }}>{l==="kk"?"ҚАЗ":"РУС"}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Chapter filter */}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
        {CHAPTERS.map(ch=>(
          <button key={ch} onClick={()=>setActiveChapter(activeChapter===ch?null:ch)} style={{
            padding:"4px 12px",borderRadius:20,fontSize:12,cursor:"pointer",
            border:`1.5px solid ${activeChapter===ch?color(ch):"#E5E7EB"}`,
            background:activeChapter===ch?color(ch):"#fff",
            color:activeChapter===ch?"#fff":"#374151",fontWeight:activeChapter===ch?600:400
          }}>{ch}</button>
        ))}
        {activeChapter&&<button onClick={()=>setActiveChapter(null)} style={{padding:"4px 10px",borderRadius:20,fontSize:12,cursor:"pointer",border:"1.5px solid #E5E7EB",background:"#F9FAFB",color:"#6B7280"}}>{cfg.all}</button>}
      </div>

      {/* Chapter terms */}
      {activeChapter&&(
        <div style={{background:"#F8FAFF",border:`1.5px solid ${color(activeChapter)}`,borderRadius:10,padding:12,marginBottom:12}}>
          <div style={{fontWeight:600,fontSize:13,color:color(activeChapter),marginBottom:8}}>{activeChapter} — {cfg.allTerms}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {GLOSSARY.filter(t=>t[cfg.catIndex]===activeChapter).map(t=>(
              <button key={t[0]} onClick={()=>{setActiveChapter(null);send(t[0]);}} style={{
                padding:"3px 10px",borderRadius:16,fontSize:12,cursor:"pointer",
                border:`1px solid ${color(activeChapter)}22`,background:`${color(activeChapter)}11`,
                color:color(activeChapter),fontWeight:500
              }}>{t[0]}</button>
            ))}
          </div>
        </div>
      )}

      {/* Chat */}
      <div ref={chatRef} style={{border:"1px solid #E5E7EB",borderRadius:12,background:"#F9FAFB",minHeight:280,maxHeight:380,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10,marginBottom:10}}>
        {messages.map((msg,i)=>{
          if(msg.welcome) return(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"#EEF2FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🤖</div>
              <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:"4px 12px 12px 12px",padding:"10px 14px",maxWidth:"85%"}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>{cfg.welcome}</div>
                <div style={{fontSize:12.5,color:"#6B7280",lineHeight:1.6}}>{cfg.welcomeSub}</div>
              </div>
            </div>
          );
          if(msg.role==="user") return(
            <div key={i} style={{display:"flex",justifyContent:"flex-end"}}>
              <div style={{background:"#EEF2FF",color:"#3730A3",borderRadius:"12px 4px 12px 12px",padding:"9px 14px",fontSize:13,maxWidth:"80%"}}>{msg.text}</div>
            </div>
          );
          if(msg.notFound) return(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"#EEF2FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🤖</div>
              <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:"4px 12px 12px 12px",padding:"10px 14px",fontSize:12.5,color:"#9CA3AF",fontStyle:"italic",maxWidth:"85%"}}>{cfg.notFound(msg.notFound)}</div>
            </div>
          );
          if(msg.results) return(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"#EEF2FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🤖</div>
              <div style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:"4px 12px 12px 12px",padding:"10px 14px",maxWidth:"90%",width:"100%"}}>
                {msg.results.map((t,j)=>(
                  <div key={j} style={{borderTop:j>0?"1px solid #F3F4F6":"none",paddingTop:j>0?8:0,marginTop:j>0?8:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:13,color:"#111827"}}>{t[0]}</span>
                      <span style={{fontSize:12,color:"#9CA3AF"}}>— {t[cfg.termIndex]}</span>
                      <span style={{marginLeft:"auto",fontSize:10,padding:"1px 7px",borderRadius:10,background:`${color(t[cfg.catIndex])}18`,color:color(t[cfg.catIndex]),fontWeight:500}}>{t[cfg.catIndex]}</span>
                    </div>
                    <div style={{fontSize:12.5,color:"#374151",lineHeight:1.6}}>{t[cfg.descIndex]}</div>
                  </div>
                ))}
              </div>
            </div>
          );
          return null;
        })}
      </div>

      {/* Chips */}
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
        {CHIPS.map(c=>(<button key={c} onClick={()=>send(c)} style={{padding:"4px 11px",borderRadius:16,fontSize:11.5,cursor:"pointer",border:"1px solid #E5E7EB",background:"#fff",color:"#374151"}}>{c}</button>))}
      </div>

      {/* Input */}
      <div style={{display:"flex",gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder={cfg.placeholder}
          style={{flex:1,padding:"10px 14px",borderRadius:8,border:"1.5px solid #E5E7EB",fontSize:13.5,outline:"none",fontFamily:"inherit"}}/>
        <button onClick={()=>send()} style={{padding:"10px 18px",borderRadius:8,border:"1.5px solid #2563EB",background:"#2563EB",color:"#fff",fontSize:13.5,cursor:"pointer",fontWeight:500}}>{cfg.btn}</button>
      </div>

      <div style={{textAlign:"center",fontSize:11,color:"#D1D5DB",marginTop:12}}>{cfg.footer} · {GLOSSARY.length} терминов</div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
